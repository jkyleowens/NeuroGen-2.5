name: Native LIF parity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslang-tools mesa-vulkan-drivers
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DNEUROGEN_VULKAN=ON
      - run: cmake --build build/native -j2
      - run: ctest --test-dir build/native --output-on-failure
      - run: python -m unittest discover -s tests -p test_native.py -v
        env:
          NEUROGEN_TEST_BACKENDS: native-cpu,vulkan
      - run: python -m neurogen language doctor --device vulkan
      - run: python -m unittest discover -s tests -v
  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake g++
      - run: cmake -S . -B build/cuda -DNEUROGEN_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DBUILD_TESTING=OFF
      - run: cmake --build build/cuda -j2
