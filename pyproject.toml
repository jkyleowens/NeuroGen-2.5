[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogen-cortical"
version = "0.5.0"
description = "Biological simulation and trainable streaming spiking language/speech research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.9,<4"]

[project.scripts]
neurogen = "neurogen.cli:main"

[project.optional-dependencies]
language = ["torch>=2.5,<3", "datasets>=4,<6"]
voice = ["torch>=2.5,<3", "datasets>=4,<6", "sounddevice>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["neurogen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
